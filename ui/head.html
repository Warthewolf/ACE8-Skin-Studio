<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACE8 Skin Studio</title>
<link rel="icon" type="image/png" href="{{FAVICON}}">
<script>
  // Apply the saved appearance before the page paints.
  try { var th = localStorage.getItem('ace8-theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (e) {}
</script>
<style>
/* ACE8 Skin Studio: a dark briefing-room look. Navy grid, thin white type, orange for what matters,
   blue for what is selected. "Day" keeps the same layout on a pale grid. */
:root {
  --bg: #070b13; --bg2: #0b1220; --panel: rgba(12, 19, 32, .82); --panel-solid: #0d1524; --raised: rgba(22, 33, 52, .9); --field: #0a111d;
  --ink: #e4ebf5; --muted: #8592a6; --faint: #5b6779;
  --line: rgba(150, 178, 215, .16); --line-strong: rgba(170, 196, 230, .32); --line-soft: rgba(150, 178, 215, .09);
  --grid: rgba(140, 170, 210, .065); --grid-dot: rgba(190, 212, 245, .28);
  --accent: #ff7a1a; --accent-hi: #ff9a4a; --accent-ink: #160900; --accent-soft: rgba(255, 122, 26, .13);
  --blue: #4c9dff; --blue-soft: rgba(76, 157, 255, .14);
  --danger: #ff5a52; --danger-soft: rgba(255, 90, 82, .12); --ok: #3fd29b; --ok-soft: rgba(63, 210, 155, .11); --focus: #6fb1ff;
  --tile-empty: #111b2b; --shadow: 0 18px 60px rgba(0, 0, 0, .55);
  --font-ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-head: "Bahnschrift", "DIN Alternate", "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --font-mono: "Cascadia Mono", Consolas, ui-monospace, "DejaVu Sans Mono", monospace;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #dfe6ef; --bg2: #e9eef5; --panel: rgba(247, 250, 253, .9); --panel-solid: #f7fafd; --raised: #ffffff; --field: #ffffff;
    --ink: #0d1726; --muted: #4f5d72; --faint: #7a8699;
    --line: rgba(30, 55, 95, .18); --line-strong: rgba(30, 55, 95, .36); --line-soft: rgba(30, 55, 95, .09);
    --grid: rgba(40, 70, 115, .08); --grid-dot: rgba(40, 70, 115, .3);
    --accent: #e35d00; --accent-hi: #c44f00; --accent-ink: #ffffff; --accent-soft: rgba(227, 93, 0, .1);
    --blue: #1660d0; --blue-soft: rgba(22, 96, 208, .1);
    --danger: #c22a22; --danger-soft: rgba(194, 42, 34, .09); --ok: #13804f; --ok-soft: rgba(19, 128, 79, .09); --focus: #1660d0;
    --tile-empty: #d3dbe6; --shadow: 0 18px 50px rgba(20, 35, 60, .25); --foot-bg: rgba(255, 255, 255, .55);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #dfe6ef; --bg2: #e9eef5; --panel: rgba(247, 250, 253, .9); --panel-solid: #f7fafd; --raised: #ffffff; --field: #ffffff;
  --ink: #0d1726; --muted: #4f5d72; --faint: #7a8699;
  --line: rgba(30, 55, 95, .18); --line-strong: rgba(30, 55, 95, .36); --line-soft: rgba(30, 55, 95, .09);
  --grid: rgba(40, 70, 115, .08); --grid-dot: rgba(40, 70, 115, .3);
  --accent: #e35d00; --accent-hi: #c44f00; --accent-ink: #ffffff; --accent-soft: rgba(227, 93, 0, .1);
  --blue: #1660d0; --blue-soft: rgba(22, 96, 208, .1);
  --danger: #c22a22; --danger-soft: rgba(194, 42, 34, .09); --ok: #13804f; --ok-soft: rgba(19, 128, 79, .09); --focus: #1660d0;
  --tile-empty: #d3dbe6; --shadow: 0 18px 50px rgba(20, 35, 60, .25); --foot-bg: rgba(255, 255, 255, .55);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; color: var(--ink); font: 14.5px/1.5 var(--font-ui);
  background:
    radial-gradient(circle at 0 0, var(--grid-dot) 1.1px, transparent 1.6px) -1px -1px / 108px 108px,
    linear-gradient(var(--grid) 1px, transparent 1px) -1px -1px / 108px 108px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) -1px -1px / 108px 108px,
    radial-gradient(ellipse 80% 60% at 15% 0%, rgba(40, 80, 150, .22), transparent 70%),
    radial-gradient(ellipse 60% 50% at 100% 100%, rgba(255, 110, 20, .06), transparent 70%),
    linear-gradient(160deg, var(--bg2), var(--bg));
  background-attachment: fixed;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3 { font-family: var(--font-head); margin: 0; text-wrap: balance; }
h1 { font-size: 30px; line-height: 1.15; font-weight: 300; letter-spacing: .1em; text-transform: uppercase; }
h2 { font-size: 15px; line-height: 1.3; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; }
p { margin: 0; }
a { color: inherit; }
code, .path { font-family: var(--font-mono); font-size: 12.5px; overflow-wrap: anywhere; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
::selection { background: var(--accent); color: var(--accent-ink); }
.mono-label { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--muted); }

.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); height: 100%; }

/* ---------- rail ---------- */
.rail { background: linear-gradient(180deg, rgba(8, 13, 22, .92), rgba(8, 13, 22, .78)); border-right: 1px solid var(--line); display: flex; flex-direction: column; padding: 20px 14px 14px; gap: 20px; overflow-y: auto; backdrop-filter: blur(6px); }
:root[data-theme="light"] .rail { background: linear-gradient(180deg, rgba(247, 250, 253, .94), rgba(238, 243, 249, .88)); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .rail { background: linear-gradient(180deg, rgba(247, 250, 253, .94), rgba(238, 243, 249, .88)); } }
/* the name sits over the lower part of the logo, with a halo in the background colour so it reads
   over the orange ring in both themes */
.brand { position: relative; width: 100%; max-width: 208px; padding: 2px 0 4px; }
.brand .emblem { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 14px rgba(0, 0, 0, .35)); }
.brand .wordmark { position: absolute; left: 0; right: 0; bottom: 2px; align-items: center; text-align: center;
  text-shadow: 0 0 2px var(--bg), 0 0 6px var(--bg), 0 0 12px var(--bg), 0 1px 1px var(--bg); }
.brand .wordmark span { color: var(--ink); font-weight: 400; }
@media (max-height: 820px) { .brand { max-width: 150px; } .brand .wordmark b { font-size: 19px; } .brand .wordmark span { font-size: 10px; } }
.wordmark { display: flex; flex-direction: column; line-height: 1; font-family: var(--font-head); }
.wordmark b { font-weight: 700; font-size: 23px; letter-spacing: .14em; }
.wordmark span { font-weight: 300; font-size: 11.5px; letter-spacing: .34em; margin-top: 5px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 1px; }
.nav button { all: unset; box-sizing: border-box; display: flex; align-items: center; gap: 10px; width: 100%; padding: 8px 12px; cursor: pointer; font-family: var(--font-head); font-size: 14px; font-weight: 400; letter-spacing: .09em; text-transform: uppercase; border-left: 2px solid transparent; color: var(--muted); }
.nav button:hover { color: var(--ink); background: var(--line-soft); }
.nav button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
.nav button[aria-current="page"] { color: var(--ink); border-left-color: var(--accent); background: linear-gradient(90deg, var(--accent-soft), transparent 85%); font-weight: 600; }
.nav .group { font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .18em; text-transform: uppercase; color: var(--faint); padding: 14px 14px 5px; }
.nav .group:first-child { padding-top: 0; }
.nav .sep { height: 1px; background: var(--line); margin: 12px 8px; }
.nav .badge { margin-left: auto; min-width: 20px; height: 18px; padding: 0 6px; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; letter-spacing: 0; }
.nav .badge.blue { background: var(--blue); color: #fff; }
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 14px; padding: 0 4px; }
.setup-status { all: unset; cursor: pointer; font-size: 12.5px; line-height: 1.35; display: flex; gap: 8px; align-items: flex-start; padding: 9px 10px; border: 1px solid var(--line); background: var(--panel); }
.setup-status:hover { border-color: var(--line-strong); }
.setup-status .dot { width: 8px; height: 8px; margin-top: 4px; flex: none; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.setup-status.bad .dot { background: var(--danger); box-shadow: 0 0 8px var(--danger); }
.seg-label { margin-bottom: 6px; }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--line); }
.seg button { all: unset; box-sizing: border-box; text-align: center; padding: 5px 0; font-size: 11px; cursor: pointer; font-family: var(--font-mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); font-weight: 700; }
.seg button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

/* ---------- main ---------- */
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.hud { display: flex; flex-wrap: wrap; gap: 0; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(5, 9, 16, .55), rgba(5, 9, 16, .2)); padding: 0 24px; }
:root[data-theme="light"] .hud { background: rgba(255, 255, 255, .45); }
@media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) .hud { background: rgba(255, 255, 255, .45); } }
.hud .cell { padding: 10px 18px 9px; border-left: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.hud .cell:first-child { border-left: 0; padding-left: 12px; }
.hud .val { font-family: var(--font-head); font-size: 13.5px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 340px; }
.hud .val.bad { color: var(--danger); }
.hud .val.good { color: var(--blue); }
.hud .val.warn { color: var(--accent); }
.hud .grow { flex: 1; }
.scroll { flex: 1; overflow-y: auto; padding: 30px 40px 70px; }
.page { max-width: 940px; display: flex; flex-direction: column; gap: 22px; }
.pagehead { display: flex; flex-direction: column; gap: 6px; }
.eyebrow { font-family: var(--font-mono); font-size: 11px; letter-spacing: .2em; color: var(--accent); text-transform: uppercase; }
.lead { color: var(--muted); max-width: 70ch; margin-top: 4px; }
.block { position: relative; background: var(--panel); border: 1px solid var(--line); padding: 20px 22px 22px; display: flex; flex-direction: column; gap: 14px; }
.block::before, .block::after { content: ""; position: absolute; width: 12px; height: 12px; border: 2px solid var(--accent); pointer-events: none; }
.block::before { top: -1px; left: -1px; border-right: 0; border-bottom: 0; }
.block::after { bottom: -1px; right: -1px; border-left: 0; border-top: 0; }
.block > h2 { display: flex; align-items: baseline; gap: 12px; }
.block > h2 .step { font-family: var(--font-mono); font-size: 12px; font-weight: 400; color: var(--accent); letter-spacing: .08em; }
.block.flash { animation: flashblock 1.8s ease-out; }
@keyframes flashblock { 0%, 35% { box-shadow: 0 0 0 2px var(--accent), 0 0 28px var(--accent-soft); border-color: var(--accent); } 100% { box-shadow: 0 0 0 0 transparent; } }
@media (prefers-reduced-motion: reduce) { .block.flash { animation: none; outline: 2px solid var(--accent); } }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--accent-hi); cursor: pointer; text-align: left; text-decoration: underline; text-underline-offset: 3px; }
.linkbtn:hover { color: var(--accent); }
.linkbtn:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.skinauto { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; font-size: 13px; color: var(--muted); border-left: 2px solid var(--ok); padding: 4px 0 4px 10px; }
.skinauto.warn { border-left-color: var(--accent); }
.skinauto b { color: var(--ink); font-weight: 600; }
.hint { color: var(--muted); font-size: 13px; max-width: 74ch; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1 1 220px; min-width: 0; }
label.field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
label.field .hint { font-weight: 400; letter-spacing: 0; text-transform: none; }
label.field input, label.field select, label.field textarea, label.field .setrow { text-transform: none; letter-spacing: 0; font-weight: 400; color: var(--ink); }
input[type="text"], input[type="password"], input[type="number"], select, textarea {
  background: var(--field); border: 1px solid var(--line-strong); border-radius: 0; padding: 8px 10px; min-height: 36px; width: 100%; min-width: 0; font-size: 14px;
}
textarea { resize: vertical; min-height: 84px; line-height: 1.45; }
input:focus, select:focus, textarea:focus { border-color: var(--blue); outline: none; box-shadow: 0 0 0 1px var(--blue), 0 0 14px var(--blue-soft); }
input[type="text"].mono, input[type="password"].mono { font-family: var(--font-mono); font-size: 13px; }
/* Hidden like a password, but an ordinary text box, so browsers never offer to save it. */
input.masked:not(:placeholder-shown) { -webkit-text-security: disc; }
select { width: auto; padding-right: 28px; }
input:disabled, select:disabled, button:disabled { opacity: .45; cursor: not-allowed; }
.check { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; cursor: pointer; }
.check input { margin: 3px 0 0; width: 16px; height: 16px; accent-color: var(--accent); flex: none; }
.check .hint { display: block; }
.texopts { margin-top: 14px; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; display: flex; flex-direction: column; gap: 10px; }

.btn { border: 1px solid var(--line-strong); background: transparent; padding: 7px 14px; min-height: 34px; cursor: pointer; font-family: var(--font-head); font-weight: 500; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; white-space: nowrap; color: var(--ink); }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent-hi); }
.btn.primary { background: var(--accent); border: 0; color: var(--accent-ink); font-size: 14px; font-weight: 700; padding: 10px 26px; min-height: 42px; letter-spacing: .14em;
  clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); }
.btn.primary:hover:not(:disabled) { background: var(--accent-hi); color: var(--accent-ink); }
.btn.quiet { border-color: transparent; text-decoration: underline; text-underline-offset: 4px; padding-left: 6px; padding-right: 6px; }
.btn.small { min-height: 28px; padding: 3px 10px; font-size: 11.5px; }
.btn.danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }

.notice { padding: 10px 14px; font-size: 13.5px; border: 1px solid var(--line); border-left: 3px solid var(--line-strong); background: var(--raised); overflow-wrap: anywhere; }
.notice.error { border-color: var(--danger); background: var(--danger-soft); }
.notice.good { border-color: var(--ok); background: var(--ok-soft); }
.notice.warn { border-color: var(--accent); background: var(--accent-soft); }
.notice.info { border-color: var(--blue); background: var(--blue-soft); }
.notice strong { font-weight: 700; }
.notice p + p { margin-top: 6px; }

/* ---------- mode switch ---------- */
.modes { display: grid; grid-template-columns: 1fr 1fr; border: 1px solid var(--line-strong); background: var(--panel); }
.modes button { all: unset; box-sizing: border-box; cursor: pointer; padding: 12px 16px; display: flex; flex-direction: column; gap: 3px; border-bottom: 3px solid transparent; }
.modes button + button { border-left: 1px solid var(--line-strong); }
.modes button b { font-family: var(--font-head); font-weight: 600; font-size: 14px; letter-spacing: .12em; text-transform: uppercase; }
.modes button span { font-size: 12.5px; color: var(--muted); }
.modes button[aria-pressed="true"] { border-bottom-color: var(--accent); background: linear-gradient(0deg, var(--accent-soft), transparent); }
.modes button:hover { background: var(--line-soft); }
.modes button:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }

/* ---------- the tile strip: a skin image with its cut lines ---------- */
.strip { position: relative; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--tile-empty); border: 1px solid var(--line-strong); aspect-ratio: var(--n, 5) / 1; overflow: hidden; }
.strip img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; display: block; }
.strip .cell { position: relative; border-left: 1px dashed var(--line-strong); min-width: 0; }
.strip .cell:first-of-type { border-left: 0; }
.strip.has-img .cell { border-left-color: #fff; mix-blend-mode: difference; }
.strip .tag { position: absolute; left: 0; bottom: 0; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-weight: 700; font-size: 11.5px; line-height: 1; padding: 4px 6px 3px; }
.strip-wrap { position: relative; flex: none; width: 100%; aspect-ratio: var(--n, 5) / 1; }
.strip-wrap > .strip { position: absolute; inset: 0; aspect-ratio: auto; }
.strip-wrap .tags { position: absolute; inset: 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; pointer-events: none; }
.strip-wrap .tags span { align-self: end; justify-self: start; background: var(--accent); color: var(--accent-ink); font-family: var(--font-mono); font-weight: 700; font-size: 11.5px; line-height: 1; padding: 4px 6px 3px; }

.drop { border: 1px dashed var(--line-strong); padding: 18px; display: flex; flex-direction: column; gap: 14px; background: rgba(76, 157, 255, .035); transition: border-color .12s, background .12s; position: relative; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop-text { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.drop-text p { flex: 1 1 260px; }

.filecard { border: 1px solid var(--line); background: var(--raised); padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.filecard .top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.filecard .name { font-weight: 700; overflow-wrap: anywhere; }
.filecard .meta { color: var(--muted); font-size: 12.5px; }
.filecard .spacer { flex: 1; }
.upbar { height: 3px; background: var(--line-soft); overflow: hidden; }
.upbar i { display: block; height: 100%; background: var(--blue); width: 0; }

.list { border: 1px solid var(--line); background: var(--raised); }
.list > * { border-top: 1px solid var(--line-soft); }
.list > *:first-child { border-top: 0; }
.vehicles { max-height: 260px; overflow-y: auto; }
.vehicles button { all: unset; box-sizing: border-box; display: flex; gap: 12px; align-items: baseline; width: 100%; padding: 7px 12px; cursor: pointer; border-top: 1px solid var(--line-soft); }
.vehicles button:first-child { border-top: 0; }
.vehicles button:hover, .vehicles button:focus-visible { background: var(--blue-soft); }
.vehicles .n { font-family: var(--font-mono); font-size: 13px; font-weight: 600; }
.vehicles .s { color: var(--muted); font-size: 12px; margin-left: auto; text-align: right; }

.skin { padding: 12px 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.skin .id { font-family: var(--font-head); font-size: 16px; font-weight: 500; letter-spacing: .06em; min-width: 190px; }
.skin .id small { font-family: var(--font-ui); font-weight: 400; color: var(--muted); font-size: 12px; display: block; letter-spacing: 0; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; flex: 1 1 200px; }
.chip { font-size: 12px; border: 1px solid var(--line); padding: 1px 7px; background: var(--panel-solid); white-space: nowrap; }
.chip.off { color: var(--muted); text-decoration: line-through; }
.chip.blue { border-color: var(--blue); color: var(--blue); }
.chip.orange { border-color: var(--accent); color: var(--accent); }
button.chip { cursor: pointer; font-family: var(--font-mono); font-size: 12.5px; padding: 3px 9px; color: inherit; }
button.chip[aria-pressed="true"] { background: var(--blue); color: #fff; border-color: var(--blue); }
#exSkinsBox[hidden] { display: none !important; }
#exSkinsBox .chips { flex: none; }
.pvgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 10px; }
.pv { border: 1px solid var(--line); background: var(--raised); padding: 8px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
.pv:hover { border-color: var(--line-strong); }
.pv.on { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue), 0 0 16px var(--blue-soft); }
.pv .top { display: flex; gap: 8px; align-items: center; }
.pv .tex { color: var(--muted); font-family: var(--font-mono); font-size: 11.5px; overflow-wrap: anywhere; flex: 1; min-width: 0; }
.pv .tags { display: none; }
.skin { flex-direction: column; align-items: stretch; }
/* pilots: helmets and radio portraits */
.pilotgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.pilotcard { border: 1px solid var(--line); background: var(--raised); padding: 8px; display: flex; flex-direction: column; gap: 4px; cursor: pointer; text-align: left; color: inherit; font: inherit; }
.pilotcard:hover { border-color: var(--line-strong); }
.pilotcard.on, .portcard.on { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue), 0 0 16px var(--blue-soft); }
.pilotcard:focus-visible, .portcard:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
